backend:
  name: github
  repo: jonathancazabonne/personal-website
  branch: master
  base_url: https://personal-website-oauth.pages.dev
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "General info"
    files:
      - file: "data/site.json"
        label: "General info"
        name: "site"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Rotating words (under name, on Home)", name: "topics", widget: "list" }
          - { label: "Rotating phrases — French version (full phrases, e.g. Diversité fongique.)", name: "topics_fr", widget: "list", required: false }
          - { label: "Small line above the name (Home hero)", name: "heroEyebrow", widget: "string", required: false }
          - { label: "Role / subtitle", name: "role", widget: "text" }
          - { label: "Role / subtitle — French version", name: "role_fr", widget: "text", required: false }
          - { label: "Big statement on Home (wrap words in **double asterisks** to highlight them)", name: "statement", widget: "text", required: false }
          - { label: "Big statement on Home — French version", name: "statement_fr", widget: "text", required: false }
          - { label: "Bio", name: "bio", widget: "text" }
          - { label: "Bio — French version (shown when the site is in French)", name: "bio_fr", widget: "text", required: false }
          - { label: "About photo (next to bio, on Home)", name: "aboutPhoto", widget: "image", required: false }
          - { label: "About photo caption", name: "aboutPhotoCaption", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Intro text above the people photos (Education & background page)", name: "connectionsIntro", widget: "text", required: false }
          - { label: "Intro text above the people photos — French version", name: "connectionsIntro_fr", widget: "text", required: false }
          - { label: "Contact form access key (Web3Forms — see setup note; leave blank to open the visitor’s email app instead)", name: "contactFormKey", widget: "string", required: false }
          - { label: "Address (shown in the site footer)", name: "address", widget: "text" }
          - { label: "Conservation timeline intro", name: "timelineIntro", widget: "text" }

  - name: "education"
    label: "Education"
    files:
      - file: "data/education.json"
        label: "Education"
        name: "education"
        fields:
          - label: "Degrees"
            name: "items"
            widget: "list"
            summary: "{{degree}} — {{years}}"
            fields:
              - { label: "Years", name: "years", widget: "string" }
              - { label: "Years — French", name: "years_fr", widget: "string", required: false }
              - { label: "Degree", name: "degree", widget: "string" }
              - { label: "Degree — French", name: "degree_fr", widget: "string", required: false }
              - { label: "Institution", name: "institution", widget: "string" }
              - { label: "Institution link (makes the institution name clickable)", name: "institutionUrl", widget: "string", required: false }
              - { label: "Detail (thesis title, supervisors, etc.)", name: "detail", widget: "text", required: false }
              - { label: "Detail — French", name: "detail_fr", widget: "text", required: false }
              - { label: "Link (thesis PDF, etc.)", name: "url", widget: "string", required: false }
              - { label: "Thesis title (French, for CV)", name: "thesisTitleFr", widget: "text", required: false }
              - { label: "Supervisors (French, for CV)", name: "supervisors", widget: "text", required: false }
              - { label: "Committee (French, for CV)", name: "committee", widget: "text", required: false }
              - { label: "Grade / honors (for CV)", name: "grade", widget: "string", required: false }
              - { label: "Institution logo (groups consecutive degrees at the same institution into one card)", name: "logo", widget: "image", required: false }

  - name: "links"
    label: "Links (shown in the site footer)"
    files:
      - file: "data/links.json"
        label: "Links (shown in the site footer)"
        name: "links"
        fields:
          - label: "Links"
            name: "items"
            widget: "list"
            summary: "{{label}}"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["link", "researchgate", "orcid", "linkedin", "scholar", "bluesky", "institution"]
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }

  - name: "publications"
    label: "Publications"
    files:
      - file: "data/publications.json"
        label: "Publications"
        name: "publications"
        fields:
          - label: "Publications"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Authors (optional — leave blank when the venue already credits the issuer, e.g. a press release)", name: "authors", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Show in the Selected work section (max 3)", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Photo (shown on the card — optional)", name: "image", widget: "image", required: false }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Peer-reviewed scientific articles", value: "peer-reviewed" }
                  - { label: "Preprints", value: "preprint" }
                  - { label: "Correspondence", value: "correspondence" }
                  - { label: "Book chapters", value: "book-chapter" }
                  - { label: "Literary book chapters", value: "literary" }
                  - { label: "Thesis and reports", value: "thesis-report" }
                  - { label: "Bulletin articles", value: "bulletin" }
                  - { label: "Popular science articles", value: "popular" }
                  - { label: "Press articles", value: "press" }
                  - { label: "Press releases", value: "press-release" }
              - label: "Status"
                name: "status"
                widget: "select"
                default: "published"
                options:
                  - { label: "Published", value: "published" }
                  - { label: "In review (submitted, not yet accepted)", value: "in-review" }

  - name: "communications"
    label: "Outreach"
    files:
      - file: "data/communications.json"
        label: "Outreach"
        name: "communications"
        fields:
          - label: "Outreach entries"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Type", name: "type", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Authors (optional — leave blank for solo media interviews)", name: "authors", widget: "string", required: false }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Player link (optional — YouTube, Vimeo, Mixcloud, Spotify, SoundCloud, Apple Podcasts or an .mp3 link; shows a player right on the site. Leave blank to use the URL above when it is one of these)", name: "embed", widget: "string", required: false }
              - { label: "Show in the Highlights section (max 3)", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Photo (shown on the card — optional)", name: "image", widget: "image", required: false }

  - name: "timeline"
    label: "Conservation timeline"
    files:
      - file: "data/timeline.json"
        label: "Conservation timeline"
        name: "timeline"
        fields:
          - label: "Milestones"
            name: "items"
            widget: "list"
            summary: "{{dateLabel}} — {{title}}"
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Date label", name: "dateLabel", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Scope", name: "scope", widget: "string", required: false }
              - { label: "Notes", name: "notes", widget: "text", required: false }
              - { label: "URLs", name: "urls", widget: "list", required: false }

  - name: "studyAreas"
    label: "Study areas"
    files:
      - file: "data/studyAreas.json"
        label: "Study areas"
        name: "studyAreas"
        fields:
          - label: "Study areas"
            name: "items"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Name (full title, shown on the page)", name: "name", widget: "string" }
              - { label: "Short name (label next to the point on the map)", name: "short", widget: "string", required: false }
              - { label: "Place (e.g. station, reserve, region)", name: "place", widget: "string", required: false }
              - { label: "Country", name: "country", widget: "string", required: false }
              - { label: "Latitude (decimal, e.g. 48.5 — keep it approximate, a few km, to protect fragile sites)", name: "lat", widget: "number", value_type: "float", required: false }
              - { label: "Longitude (decimal, e.g. -79.4 — negative = west)", name: "lng", widget: "number", value_type: "float", required: false }
              - { label: "Period (e.g. Ph.D. · 2024–present)", name: "period", widget: "string", required: false }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Partners", name: "partners", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Cover photo (big picture at the top of the section)", name: "cover", widget: "image", required: false }
              - { label: "Name — French", name: "name_fr", widget: "string", required: false }
              - { label: "Short name — French", name: "short_fr", widget: "string", required: false }
              - { label: "Place — French", name: "place_fr", widget: "string", required: false }
              - { label: "Period — French", name: "period_fr", widget: "string", required: false }
              - { label: "Role — French", name: "role_fr", widget: "string", required: false }
              - { label: "Partners — French", name: "partners_fr", widget: "string", required: false }
              - { label: "Description — French", name: "description_fr", widget: "text", required: false }
              - label: "Photos"
                name: "photos"
                widget: "list"
                required: false
                summary: "{{caption}}"
                fields:
                  - { label: "Photo", name: "src", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "footerLogos"
    label: "Footer logos (affiliations)"
    files:
      - file: "data/footerLogos.json"
        label: "Footer logos (affiliations)"
        name: "footerLogos"
        fields:
          - label: "Logos (shown in the footer, in this order)"
            name: "items"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Organisation name", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Link (website)", name: "url", widget: "string", required: false }

  - name: "training"
    label: "Scientific and professional training"
    files:
      - file: "data/training.json"
        label: "Scientific and professional training"
        name: "training"
        fields:
          - label: "Training entries"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title link (makes the title clickable)", name: "url", widget: "string", required: false }
              - { label: "Provider", name: "provider", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
              - { label: "Provider logo (groups consecutive entries sharing the same logo into one card)", name: "logo", widget: "image", required: false }

  - name: "researchStays"
    label: "Professional experience & research stays"
    files:
      - file: "data/researchStays.json"
        label: "Professional experience & research stays"
        name: "researchStays"
        fields:
          - label: "Entries"
            name: "items"
            widget: "list"
            summary: "{{period}} — {{institution}}"
            fields:
              - { label: "Institution", name: "institution", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Supervisors", name: "supervisors", widget: "text", required: false }
              - { label: "Logo 1 (groups consecutive entries sharing the same pair of logos into one card)", name: "logo", widget: "image", required: false }
              - { label: "Logo 2 (optional second logo, e.g. a co-supervising lab)", name: "logo2", widget: "image", required: false }
              - { label: "Link 1 (for the institution name matching Logo 1 — if the institution has one name, use this)", name: "url", widget: "string", required: false }
              - { label: "Link 2 (for the institution name matching Logo 2, when the institution text has two parts separated by an em dash)", name: "url2", widget: "string", required: false }

  - name: "scientificAffiliations"
    label: "Main scientific affiliations"
    files:
      - file: "data/scientificAffiliations.json"
        label: "Main scientific affiliations"
        name: "scientificAffiliations"
        fields:
          - label: "Affiliations"
            name: "items"
            widget: "list"
            summary: "{{organization}}"
            fields:
              - { label: "Organization", name: "organization", widget: "string" }
              - { label: "Organization link (makes the name clickable)", name: "url", widget: "string", required: false }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Period (leave blank if ongoing/not dated)", name: "period", widget: "string", required: false }
              - { label: "Logo 1", name: "logo", widget: "image", required: false }
              - { label: "Logo 2", name: "logo2", widget: "image", required: false }
              - { label: "Logo 3", name: "logo3", widget: "image", required: false }

  - name: "communityEngagement"
    label: "Community & volunteer engagement"
    files:
      - file: "data/communityEngagement.json"
        label: "Community & volunteer engagement"
        name: "communityEngagement"
        fields:
          - label: "Engagements"
            name: "items"
            widget: "list"
            summary: "{{organization}}"
            fields:
              - { label: "Organization", name: "organization", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Period", name: "period", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Logo 1", name: "logo", widget: "image", required: false }
              - { label: "Logo 2", name: "logo2", widget: "image", required: false }
              - { label: "Logo 3", name: "logo3", widget: "image", required: false }

  - name: "awards"
    label: "Awards & funding"
    files:
      - file: "data/awards.json"
        label: "Awards & funding"
        name: "awards"
        fields:
          - label: "Award entries"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Amount ($)", name: "amount", widget: "number", value_type: "int", required: false }
              - { label: "Status", name: "status", widget: "string", required: false }

  - name: "memberships"
    label: "Society memberships"
    files:
      - file: "data/memberships.json"
        label: "Society memberships"
        name: "memberships"
        fields:
          - label: "Membership entries"
            name: "items"
            widget: "list"
            summary: "{{period}} — {{organization}}"
            fields:
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Organization", name: "organization", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }

  - name: "committees"
    label: "Organizing committees"
    files:
      - file: "data/committees.json"
        label: "Organizing committees"
        name: "committees"
        fields:
          - label: "Committee entries"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{description}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "peerReview"
    label: "Peer review"
    files:
      - file: "data/peerReview.json"
        label: "Peer review"
        name: "peerReview"
        fields:
          - label: "Peer review entries"
            name: "items"
            widget: "list"
            summary: "{{journal}} ({{count}})"
            fields:
              - { label: "Journal", name: "journal", widget: "string" }
              - { label: "Count", name: "count", widget: "number", value_type: "int" }

  - name: "editorialRoles"
    label: "Editorial roles"
    files:
      - file: "data/editorialRoles.json"
        label: "Editorial roles"
        name: "editorialRoles"
        fields:
          - label: "Editorial role entries"
            name: "items"
            widget: "list"
            summary: "{{period}} — {{description}}"
            fields:
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Period", name: "period", widget: "string" }

  - name: "teaching"
    label: "Teaching"
    files:
      - file: "data/teaching.json"
        label: "Teaching"
        name: "teaching"
        fields:
          - label: "Teaching entries"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
              - { label: "Institution", name: "institution", widget: "string" }

  - name: "publicEngagement"
    label: "Public engagement"
    files:
      - file: "data/publicEngagement.json"
        label: "Public engagement"
        name: "publicEngagement"
        fields:
          - label: "Public engagement entries"
            name: "items"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "researchAxes"
    label: "Research axes"
    files:
      - file: "data/researchAxes.json"
        label: "Research axes"
        name: "researchAxes"
        fields:
          - label: "Research axes"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Title — French", name: "title_fr", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Description — French", name: "description_fr", widget: "text", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }

  - name: "homeGallery"
    label: "People photos (Education & background page)"
    files:
      - file: "data/homeGallery.json"
        label: "People photos (Education & background page)"
        name: "homeGallery"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "src", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }

  - name: "quotes"
    label: "Quotes (rotate under your name on Home)"
    files:
      - file: "data/quotes.json"
        label: "Quotes"
        name: "quotes"
        fields:
          - label: "Quotes"
            name: "items"
            widget: "list"
            summary: "{{attribution}}"
            fields:
              - { label: "Quote text", name: "text", widget: "text" }
              - { label: "Attribution", name: "attribution", widget: "string" }

  - name: "cvSettings"
    label: "CV settings"
    files:
      - file: "data/cvSettings.json"
        label: "CV settings"
        name: "cvSettings"
        fields:
          - { label: "Bio — long CV, French", name: "bioFr", widget: "text" }
          - { label: "Bio — long CV, English", name: "bioEn", widget: "text" }
          - { label: "Bio — résumé CV, French", name: "resumeBioFr", widget: "text", hint: "The résumé CV's English bio reuses the site's General info bio." }
          - { label: "Position summary — long CV, French", name: "positionSummary", widget: "text" }
          - { label: "Position summary — long CV, English", name: "positionSummaryEn", widget: "text" }
          - { label: "Résumé tagline — English", name: "resumeTagline", widget: "string" }
          - { label: "Résumé tagline — French", name: "resumeTaglineFr", widget: "string" }
          - { label: "Leadership highlights — English (curated bullets)", name: "leadershipHighlights", widget: "list" }
          - { label: "Leadership highlights — French (curated bullets)", name: "leadershipHighlightsFr", widget: "list" }
          - { label: "Notable awards text — English (curated)", name: "notableAwardsText", widget: "text" }
          - { label: "Notable awards text — French (curated)", name: "notableAwardsTextFr", widget: "text" }
          - { label: "Academic email (CV only)", name: "academicEmail", widget: "string" }
          - { label: "Mycosphaera email (CV only)", name: "mycosphaeraEmail", widget: "string" }
