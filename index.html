  :root{
    --font: Helvetica, Arial, Verdana, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif;
    --bg:#EFF1E8;
    --surface:#FBFAF4;
    --ink:#171C15;
    --muted:#5B6355;
    --line:#D7DACB;
    --accent:#3F5C3F;
    --accent-2:#A8813C;
    --accent-contrast:#FBFAF4;
    --shadow: 0 1px 2px rgba(23,28,21,0.06), 0 8px 24px rgba(23,28,21,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12140F;
      --surface:#181C13;
      --ink:#ECEAE0;
      --muted:#9AA08C;
      --line:#2B3023;
      --accent:#8FBB7B;
      --accent-2:#D8B872;
      --accent-contrast:#12140F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12140F;
    --surface:#181C13;
    --ink:#ECEAE0;
    --muted:#9AA08C;
    --line:#2B3023;
    --accent:#8FBB7B;
    --accent-2:#D8B872;
    --accent-contrast:#12140F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  html{ color-scheme: light dark; font-size:18px; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{ font-family:var(--font); font-weight:700; text-wrap:balance; letter-spacing:-0.01em; }
  a{ color:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }

  .shell{ position:relative; z-index:1; }

  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; row-gap:8px;
    padding: 16px clamp(20px,5vw,64px);
    backdrop-filter: blur(10px) saturate(1.1);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .wordmark{
    font-family:var(--font); font-weight:700; font-size:1.05rem;
    text-decoration:none; letter-spacing:0.01em;
  }
  .wordmark-role{
    font-family:var(--font); font-size:0.78rem; color:var(--muted);
  }
  .topnav{ display:flex; flex-wrap:wrap; gap:6px clamp(12px,3vw,32px); font-size:0.92rem; }
  .topnav a{ font-family:"Raleway", var(--font); font-weight:700; text-decoration:none; color:var(--muted); padding:2px 0; border-bottom:1px solid transparent; transition:color .15s, border-color .15s; white-space:nowrap; }
  .topnav a:hover{ color:var(--ink); border-color:var(--accent); }
  @media (max-width: 560px){
    .topnav{ width:100%; gap:6px 16px; font-size:0.86rem; }
  }

  main{ max-width:760px; margin:0 auto; padding: 0 clamp(20px,6vw,64px) 40px; }

  section{ position:relative; padding: clamp(56px,10vw,104px) 0 clamp(40px,7vw,72px); border-left:1px solid transparent; }
  section + section{ border-top:1px solid var(--line); }

  .hero h1{
    margin:0; font-weight:700; font-size:clamp(2.4rem, 6vw, 3.6rem); line-height:1.04;
  }
  .hero-line{
    font-family:var(--font); font-style:italic; font-weight:400;
    font-size:clamp(1.5rem, 3.6vw, 2.1rem); color:var(--accent);
    margin: 14px 0 22px; min-height:1.3em;
  }
  .hero-line .fixed-word{ font-style:normal; color:var(--ink); opacity:0.75; }
  .cycle-word::after{
    content:""; display:inline-block; width:2px; height:1em; margin-left:2px;
    background:currentColor; vertical-align:-0.15em; animation:blink 1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .cycle-word::after{ animation:none; } }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  .hero-sub{ max-width:56ch; color:var(--ink); font-size:1.05rem; }
  .hero-sub .note{ color:var(--muted); font-size:0.92rem; display:block; margin-top:10px; }

  h2{ font-weight:500; font-size:clamp(1.3rem,2.6vw,1.6rem); margin:0 0 20px; }
  .bio{ max-width:62ch; font-size:1.02rem; }
  .bio .note{ color:var(--muted); font-size:0.9rem; display:block; margin-top:14px; }

  /* ---- education + travel map ---- */
  .home-cv-row{ display:flex; gap:40px; flex-wrap:wrap; align-items:flex-start; }
  .home-cv-row > .entry-list{ flex:1 1 320px; min-width:260px; margin:0; }
  .home-cv-row > #education-edit{ flex:1 1 320px; min-width:260px; }
  .travel-map{ flex:1 1 280px; min-width:240px; max-width:440px; }
  .travel-map svg{ width:100%; height:auto; display:block; }
  .map-land{ fill:var(--line); }
  .map-cluster-label{ font-family:var(--font); font-size:22px; fill:var(--muted); }
  .map-pin{ cursor:pointer; }
  .map-pin circle{ fill:var(--accent); stroke:var(--bg); stroke-width:3; transition:fill .15s ease; }
  .map-pin:hover circle, .map-pin:focus circle{ fill:var(--accent-2); }
  .map-pin:focus{ outline:none; }
  .travel-map-caption{ font-size:0.82rem; color:var(--muted); margin:12px 0 0; }

  .contact-row{ display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 14px; margin-bottom:22px; }
  .email-link{
    font-family:var(--font); font-weight:700; font-size:1.3rem; text-decoration:none;
    border-bottom:1px solid var(--accent); padding-bottom:2px;
  }
  .email-link:hover{ color:var(--accent); }

  .links-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .links-list a{
    text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    font-size:0.98rem; width:fit-content; border-bottom:1px solid transparent;
  }
  .links-list a:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .links-list a::after{ content:"↗"; font-size:0.8em; color:var(--muted); }

  .page-title{ margin:0 0 16px; font-weight:700; font-size:clamp(2rem,5vw,2.7rem); line-height:1.08; text-align:center; }
  .page-intro{ max-width:60ch; color:var(--muted); font-size:1.02rem; }

  .year-block{ border-top:1px solid var(--line); }
  .year-block:first-of-type{ border-top:none; margin-top:8px; }
  .year-block summary{
    list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:12px;
    padding:18px 2px; -webkit-tap-highlight-color:transparent;
  }
  .year-block summary::-webkit-details-marker{ display:none; }
  .year-block .marker{
    font-family:var(--font); color:var(--accent); width:14px; flex:0 0 auto;
    font-size:1.05rem;
  }
  .year-block .marker::before{ content:"+"; }
  .year-block[open] .marker::before{ content:"–"; }
  .year-num{ font-family:var(--font); font-size:1.4rem; font-weight:700; }
  .year-block summary:hover .year-num{ color:var(--accent); }
  .year-count{ color:var(--muted); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.09em; }

  .entry-list{ list-style:none; margin:0 0 24px; padding:0 0 6px 26px; display:flex; flex-direction:column; gap:18px; }
  .entry-list .entry-title{ display:block; color:var(--ink); font-weight:500; }
  .entry-list .entry-meta{ display:block; color:var(--muted); font-size:0.9rem; margin-top:3px; }
  .entry-type{
    display:inline-block; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--accent-2); margin-right:2px;
  }
  .entry-list .entry-link{ margin-left:6px; text-decoration:none; color:var(--muted); }
  .entry-list .entry-link:hover{ color:var(--accent); }

  .entry-card{
    border:1px solid var(--line); border-radius:9px; padding:16px 44px 4px 16px;
    margin-bottom:14px; background:var(--surface); position:relative;
  }
  .entry-card .remove-entry{ position:absolute; top:12px; right:12px; }
  .entry-card .field-row, .study-area-card .field-row{ display:flex; gap:8px; margin-bottom:10px; }
  .entry-card .field-row input, .study-area-card .field-row input{
    font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--ink); min-width:0; width:100%;
  }
  .entry-card .year-input{ width:84px; flex:0 0 auto; }
  .entry-card .grow-input, .study-area-card .grow-input{ flex:1 1 auto; }
  .entry-card .url-field{ font-size:0.88rem; color:var(--muted); }

  /* ---- timeline ---- */
  .timeline{
    list-style:none; margin:0; padding:4px 0 0 26px; position:relative;
  }
  .timeline::before{
    content:""; position:absolute; left:5px; top:6px; bottom:14px; width:1px;
    background:var(--line);
  }
  .tl-item{

  function groupByYear(list){
    var map = {}, order = [];
    list.forEach(function(item){
      var y = item.year || "Undated";
      if (!map[y]) { map[y] = []; order.push(y); }
      map[y].push(item);
    });
    var years = order.slice().sort(function(a, b){ return (Number(b) || 0) - (Number(a) || 0); });
    return years.map(function(y){ return { year: y, items: map[y] }; });
  }

    if (view === "contact") return renderContactView(d);

  function renderTravelMap(){
    var pins = [
      { x: 496, y: 124, label: "Lycée agricole d'Auzeville — CPGE, BCPST (2018–2021)" },
      { x: 512, y: 134, label: "Université Paul Sabatier — B.Sc. in Biology (2018–2021)" },
      { x: 274, y: 110, label: "Amos, Québec — M.Sc. in Forest Ecology and Management (2022–2024)" },
      { x: 290, y: 121, label: "Rouyn-Noranda, Québec — Ph.D. Candidate in Forest Ecology and Management (2024–present)" }
    ];
    var pinsHtml = pins.map(function(p){
      return '<g class="map-pin" tabindex="0">' +
        '<title>' + esc(p.label) + '</title>' +
        '<circle cx="' + p.x + '" cy="' + p.y + '" r="9"></circle>' +
      '</g>';
    }).join("");
    return '<div class="travel-map">' +
      '<svg viewBox="0 0 1000 500" role="img" aria-label="World map with pins marking places from my education">' +
        '<path class="map-land" fill-rule="evenodd" d="' + WORLD_MAP_PATH + '"></path>' +
        '<text class="map-cluster-label" x="524" y="118">Toulouse, France</text>' +
        '<text class="map-cluster-label" x="196" y="150">Abitibi-Témiscamingue,</text>' +
        '<text class="map-cluster-label" x="196" y="168">Québec</text>' +
        pinsHtml +
      '</svg>' +
      '<p class="travel-map-caption">Places from my education — hover or focus a pin for details.</p>' +
    '</div>';
  }

  function renderEducationView(d){
    if (!d.education || !d.education.length) return "";
    return '<section id="education">' +
      '<h2>Education</h2>' +
      '<div class="home-cv-row">' +
        '<ul class="entry-list">' + d.education.map(renderEducationItem).join("") + '</ul>' +
        renderTravelMap() +
      '</div>' +
    '</section>';
  }

        { key: "url", cls: "grow-input url-field", placeholder: "https:// (link to thesis PDF, optional)" }
      ], "remove-edu");
    }).join("");
    return '<section id="education">' +
      '<h2>Education</h2>' +

  function csvField(v){
    var s = String(v == null ? "" : v);
    if (/["\n,]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function downloadCSV(filename, header, rows){
    var lines = [header.map(csvField).join(",")];
    rows.forEach(function(r){ lines.push(r.map(csvField).join(",")); });
    var csv = lines.join("\r\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  function downloadPublicationsCSV(){
    var records = (current.publications || []).map(function(p){
      return {
        year: p.year || "",
        category: PUB_CATEGORY_LABELS[p.category] || p.category || "",
        title: p.title || "",
        authors: p.authors || "",
        venue: p.venue || "",
        url: (p.url && p.url !== "#") ? p.url : ""
      };
    });
    records.sort(function(a, b){
      if (a.category !== b.category) return a.category < b.category ? -1 : 1;
      if ((b.year || 0) !== (a.year || 0)) return (b.year || 0) - (a.year || 0);
      return String(a.title).localeCompare(String(b.title));
    });
    downloadCSV(
      "publications.csv",
      ["Year", "Category", "Title", "Authors", "Venue", "URL"],
      records.map(function(r){ return [r.year, r.category, r.title, r.authors, r.venue, r.url]; })
    );
  }

  function parseTimelineTSV(text){
    var lines = text.split(/\r\n|\n|\r/).filter(function(l){ return l.trim() !== ""; });
    var out = [];
    lines.forEach(function(line){
      var cols = line.split("\t");
      var name = (cols[0] || "").trim();
      var desc = (cols[1] || "").trim();
      var scope = (cols[2] || "").trim();
      var dateStr = (cols[4] || "").trim();
      var links = (cols[5] || "").trim();
      var notes = (cols[6] || "").trim();
      var yearMatch = dateStr.match(/(\d{4})/);
      if (!name || !yearMatch) return;
      out.push({
        year: parseInt(yearMatch[1], 10),
        dateLabel: dateStr || yearMatch[1],
        title: name,
        description: (desc && desc !== "-") ? desc : "",
        scope: (scope && scope !== "-" && scope !== "?") ? scope : "",
        notes: (notes && notes !== "-") ? notes : "",
        urls: links.match(/https?:\/\/\S+/g) || []
      });
    });
    out.sort(function(a, b){ return a.year - b.year; });
    return out;
  }

  // ---------- shared: image upload / compression ----------
  function fileToCompressedDataURL(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = function(){ reject(new Error("image load failed")); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error("file read failed")); };
      reader.readAsDataURL(file);
    });
  }

  // ---------- topic typewriter ----------
  var cycleTimer = null;
  function startCycle(topics){
    var el = document.getElementById("topic-cycle");
    if (!el) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      el.textContent = topics[0] || "";
      return;
    }
    if (!topics.length){ el.textContent = ""; return; }
    var i = 0;
    function typeThenDelete(){
      var word = topics[i % topics.length];
      var ci = 0;
      (function typeStep(){
        el.textContent = word.slice(0, ci);
        ci++;
        if (ci <= word.length){ cycleTimer = setTimeout(typeStep, 55); }
        else { cycleTimer = setTimeout(function(){ deleteStep(word, word.length); }, 1500); }
      })();
    }
    function deleteStep(word, ci){
      if (ci >= 0){
        el.textContent = word.slice(0, ci);
        ci--;
        cycleTimer = setTimeout(function(){ deleteStep(word, ci); }, 32);
      } else {
        i++;
        cycleTimer = setTimeout(typeThenDelete, 250);
      }
    }
    typeThenDelete();
  }
  function stopCycle(){ if (cycleTimer) { clearTimeout(cycleTimer); cycleTimer = null; } }

  // ---------- publications: category filter ----------
  function wirePublicationsHandlers(){
    var chips = Array.prototype.slice.call(document.querySelectorAll(".pub-toolbar .chip"));
    if (!chips.length) return;
    var yearBlocks = Array.prototype.slice.call(document.querySelectorAll("#pub-list .year-block"));
    var totalItems = document.querySelectorAll("#pub-list .entry-list li").length;
    var countEl = document.getElementById("pub-count");
    var active = "all";

    function applyFilter(){
      var visibleTotal = 0;
      yearBlocks.forEach(function(block){
        var lis = Array.prototype.slice.call(block.querySelectorAll("li"));
        var visible = 0;
        lis.forEach(function(li){
          var show = active === "all" || li.dataset.category === active;
          li.style.display = show ? "" : "none";
          if (show) visible++;
        });
        block.style.display = visible ? "" : "none";
        var countSpan = block.querySelector(".year-count");
        if (countSpan) countSpan.textContent = visible + (visible === 1 ? " entry" : " entries");
        visibleTotal += visible;
      });
      if (countEl) countEl.textContent = visibleTotal + " of " + totalItems + " publications shown";
    }

    function withTransition(run){
      if (document.startViewTransition) document.startViewTransition(run);
      else run();
    }

    chips.forEach(function(chip){
      chip.addEventListener("click", function(){
        withTransition(function(){
          active = chip.dataset.category;
          chips.forEach(function(c){ c.classList.toggle("active", c === chip); });
          applyFilter();
        });
      });
    });

    applyFilter();
  }

  // ---------- timeline toolbar: reveal-on-scroll + decade/scope filters ----------
  function wireTimelineHandlers(){
    var items = Array.prototype.slice.call(document.querySelectorAll(".tl-item"));
    if (!items.length) return;

    if ("IntersectionObserver" in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting){
            entry.target.classList.add("tl-inview");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
      items.forEach(function(el){ io.observe(el); });
    } else {
      items.forEach(function(el){ el.classList.add("tl-inview"); });
    }

    var yearSelect = document.getElementById("tl-year-select");
    var chips = Array.prototype.slice.call(document.querySelectorAll(".filter-row .chip"));
    var countEl = document.getElementById("tl-count");
    var activeYear = "all";
    var activeScope = "all";

    function applyFilters(){
      var visible = 0;
      items.forEach(function(el){
        var matchYear = activeYear === "all" || el.dataset.year === activeYear;
        var matchScope = activeScope === "all" || el.dataset.scopeGroup === activeScope;
        var show = matchYear && matchScope;
        el.classList.toggle("tl-hidden", !show);
        if (show) visible++;
      });
      if (countEl) countEl.textContent = visible + " of " + items.length + " milestones shown";
    }

    function withTransition(run){
      if (document.startViewTransition) document.startViewTransition(run);
      else run();
    }

    if (yearSelect){
      yearSelect.addEventListener("change", function(){
        withTransition(function(){
          activeYear = yearSelect.value;
          applyFilters();
        });
      });
    }

    chips.forEach(function(chip){
      chip.addEventListener("click", function(){
        withTransition(function(){
          activeScope = chip.dataset.scopeGroup;
          chips.forEach(function(c){ c.classList.toggle("active", c === chip); });
          applyFilters();
        });
      });
    });

    applyFilters();
  }

  function readFormIntoCurrent(){
    var d = current;

      d.education = readEntryCards("#education-edit", ["years", "degree", "institution", "detail", "url"]);

      if (introEl) d.publicationsIntro = introEl.textContent;
      d.publications = readEntryCards("#pubs-edit", ["year", "authors", "title", "venue", "url", "category"]);

      d.communications = readEntryCards("#comms-edit", ["year", "type", "title", "venue", "url"]);

      readConservationForm(d);

        return {
          icon: row.querySelector(".icon-select").value,
          label: row.querySelector(".link-label").value.trim() || "Link",
          href: row.querySelector(".link-url").value.trim() || "#"
        };
      });
    } else if (view === "study-areas"){
      var stIntro = document.getElementById("f-study-intro");
      if (stIntro) d.studyAreasIntro = stIntro.textContent;
      var areaCards = document.querySelectorAll("#study-edit-list .study-area-card");
      Array.prototype.forEach.call(areaCards, function(card){
        var idx = Number(card.dataset.idx);
        var area = d.studyAreas[idx];
        if (!area) return;
        var nameInput = card.querySelector('[data-key="name"]');
        var descInput = card.querySelector('[data-key="description"]');
        if (nameInput) area.name = nameInput.value.trim() || area.name;
        if (descInput) area.description = descInput.value;
      });
    }
    return d;
  }

  function readEntryCards(containerSel, keys){
    var cards = document.querySelectorAll(containerSel + " .entry-card");
    return Array.prototype.map.call(cards, function(card){
      var obj = {};
      keys.forEach(function(k){
        var input = card.querySelector('[data-key="' + k + '"]');
        var val = input ? input.value.trim() : "";
        obj[k] = (k === "year") ? (Number(val) || new Date().getFullYear()) : val;
      });
      return obj;
    });
  }

  var saveBtn = document.getElementById("edit-save");
  var cancelBtn = document.getElementById("edit-cancel");

  toggleBtn.addEventListener("click", function(){
    snapshot = JSON.parse(JSON.stringify(current));
    editMode = true;
    editBar.hidden = false;
    toggleBtn.hidden = true;
    statusEl.textContent = "Editing — click any text to change it.";
    paint();
  });

  cancelBtn.addEventListener("click", function(){
    current = snapshot || current;
    editMode = false;
    editBar.hidden = true;
    toggleBtn.hidden = false;
    paint();
  });

  saveBtn.addEventListener("click", function(){
    readFormIntoCurrent();
    if (current.timeline) current.timeline.sort(function(a, b){ return (b.year || 0) - (a.year || 0); });
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    statusEl.textContent = "Preparing download…";
    try {
      var html = buildFullDocument(current);
      var blob = new Blob([html], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      statusEl.textContent = "Downloaded index.html — replace the file in your project, then commit & push to update the live site.";
      editMode = false;
      editBar.hidden = true;
      toggleBtn.hidden = false;
      paint();
    } catch (e) {
      statusEl.textContent = "Couldn't prepare the download. Try again.";
    }
    saveBtn.disabled = false;
    cancelBtn.disabled = false;
  });

  // ---------- timeline tap-to-open (desktop keeps hover; touch/keyboard get a toggle) ----------
  app.addEventListener("click", function(ev){
    if (ev.target.closest("a")) return;
    var item = ev.target.closest(".tl-item");
    if (item) item.classList.toggle("tl-open");
  });
  app.addEventListener("keydown", function(ev){
    if (ev.key !== "Enter" && ev.key !== " ") return;
    var item = ev.target.closest && ev.target.closest(".tl-item");
    if (item){ ev.preventDefault(); item.classList.toggle("tl-open"); }
  });

  // ---------- init ----------
  applyRoute(false);
  window.addEventListener("hashchange", function(){ applyRoute(true); });

  // Standalone build: no Claude Artifact host here, so editing always stays available
  // and "Save changes" downloads an updated index.html instead of publishing in place.
})();
</script>
</body>
</html>
