  :root{
    --font: Helvetica, Arial, Verdana, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif;
    --bg:#FFFFFF;
    --surface:#F7F7F4;
    --ink:#171C15;
    --muted:#5B6355;
    --line:#DEDEDA;
    --accent:#3F5C3F;
    --accent-2:#A8813C;
    --accent-contrast:#FBFAF4;
    --shadow: 0 1px 2px rgba(23,28,21,0.06), 0 8px 24px rgba(23,28,21,0.05);
  }
  /* Site is fixed to the light/white theme regardless of OS preference.
     The dark variant below is kept dormant (data-theme="dark") in case
     a manual toggle is added later. */
  :root[data-theme="dark"]{
    --bg:#12140F;
    --surface:#181C13;
    --ink:#ECEAE0;
    --muted:#9AA08C;
    --line:#2B3023;
    --accent:#8FBB7B;
    --accent-2:#D8B872;
    --accent-contrast:#12140F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  html{ color-scheme: light dark; font-size:18px; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{ font-family:var(--font); font-weight:700; text-wrap:balance; letter-spacing:-0.01em; }
  a{ color:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }

  .shell{ position:relative; z-index:1; }

  .topbar{
    position:sticky; top:0; z-index:20;
    backdrop-filter: blur(10px) saturate(1.1);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; row-gap:8px;
    max-width:1600px; margin:0 auto;
    padding: 16px clamp(20px,5vw,64px);
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .wordmark{
    font-family:var(--font); font-weight:700; font-size:1.05rem;
    text-decoration:none; letter-spacing:0.01em;
  }
  .wordmark-role{
    font-family:var(--font); font-size:0.78rem; color:var(--muted);
  }
  .topnav{ display:flex; flex-wrap:wrap; gap:6px clamp(12px,3vw,32px); font-size:0.92rem; }
  .topnav a{ font-family:"Raleway", var(--font); font-weight:700; text-decoration:none; color:var(--muted); padding:2px 0; border-bottom:1px solid transparent; transition:color .15s, border-color .15s; white-space:nowrap; }
  .topnav a:hover{ color:var(--ink); border-color:var(--accent); }
  @media (max-width: 560px){
    .topnav{ width:100%; gap:6px 16px; font-size:0.86rem; }
  }

  main{ max-width:1600px; margin:0 auto; padding: 0 clamp(20px,6vw,64px) 40px; }

  section{ position:relative; padding: clamp(56px,10vw,104px) 0 clamp(40px,7vw,72px); border-left:1px solid transparent; }
  section + section{ border-top:1px solid var(--line); }

  .hero h1{
    margin:0; font-weight:700; font-size:clamp(2.4rem, 6vw, 3.6rem); line-height:1.04;
  }
  .hero-line{
    font-family:var(--font); font-style:italic; font-weight:400;
    font-size:clamp(1.5rem, 3.6vw, 2.1rem); color:var(--accent);
    margin: 14px 0 22px; min-height:1.3em;
  }
  .hero-line .fixed-word{ font-style:normal; color:var(--ink); opacity:0.75; }
  .cycle-word::after{
    content:""; display:inline-block; width:2px; height:1em; margin-left:2px;
    background:currentColor; vertical-align:-0.15em; animation:blink 1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .cycle-word::after{ animation:none; } }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  .hero-sub{ max-width:72ch; color:var(--ink); font-size:1.05rem; }
  .hero-sub .note{ color:var(--muted); font-size:0.92rem; display:block; margin-top:10px; }

  h2{ font-weight:500; font-size:clamp(1.3rem,2.6vw,1.6rem); margin:0 0 20px; }
  .bio{ max-width:78ch; font-size:1.02rem; }
  .bio .note{ color:var(--muted); font-size:0.9rem; display:block; margin-top:14px; }

  .about-layout{ display:flex; gap:clamp(24px,4vw,48px); flex-wrap:wrap; align-items:flex-start; }
  .about-layout .bio{ flex:1 1 420px; }
  .about-photo{ flex:1 1 280px; max-width:340px; margin:0; }
  .about-photo img{ width:100%; height:auto; border-radius:10px; display:block; }
  .about-photo figcaption{ font-size:0.85rem; color:var(--muted); margin-top:8px; }

  #gallery .carousel{ display:block; overflow:visible; padding:0; margin:0; }
  #gallery .carousel-item{ display:none; width:100%; }
  #gallery .carousel-item.active{ display:block; }
  #gallery .carousel-item img{ width:100%; height:min(65vh, 620px); border-radius:14px; object-fit:contain; background:var(--surface); }
  #gallery .carousel-item figcaption{ font-size:0.95rem; margin-top:12px; }
  #gallery .carousel-arrow{ top:50%; transform:translateY(-50%); width:44px; height:44px; font-size:1.3rem; }
  #gallery .carousel-arrow.prev{ left:16px; }
  #gallery .carousel-arrow.next{ right:16px; }
  @media (max-width:640px){
    #gallery .carousel-arrow{ display:flex; }
  }


  .contact-row{ display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 14px; margin-bottom:22px; }
  .email-link{
    font-family:var(--font); font-weight:700; font-size:1.3rem; text-decoration:none;
    border-bottom:1px solid var(--accent); padding-bottom:2px;
  }
  .email-link:hover{ color:var(--accent); }

  .links-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .links-list a{
    text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    font-size:0.98rem; width:fit-content; border-bottom:1px solid transparent;
  }
  .links-list a:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .links-list a::after{ content:"↗"; font-size:0.8em; color:var(--muted); }

  .page-title{ margin:0 0 16px; font-weight:700; font-size:clamp(2rem,5vw,2.7rem); line-height:1.08; text-align:center; }
  .page-intro{ max-width:75ch; color:var(--muted); font-size:1.02rem; }

  .year-accordion{ border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); margin-top:8px; }
  .year-block{ border-top:1px dashed var(--line); }
  .year-block:first-of-type{ border-top:none; }
  .year-block summary{
    list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:12px;
    padding:18px 2px; -webkit-tap-highlight-color:transparent;
  }
  .year-block summary::-webkit-details-marker{ display:none; }
  .year-block .marker{
    font-family:var(--font); color:var(--accent); width:14px; flex:0 0 auto;
    font-size:1.05rem;
  }
  .year-block .marker::before{ content:"+"; }
  .year-block[open] .marker::before{ content:"–"; }
  .year-num{ font-family:var(--font); font-size:1.4rem; font-weight:700; margin:0; }

  .axis-accordion{ border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); margin-top:8px; }
  .axis-block{ border-top:1px dashed var(--line); }
  .axis-block:first-of-type{ border-top:none; }
  .axis-block summary{
    list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:12px;
    padding:18px 2px; -webkit-tap-highlight-color:transparent;
  }
  .axis-block summary::-webkit-details-marker{ display:none; }
  .axis-block summary:hover .axis-title{ color:var(--accent); }
  .axis-title{ font-family:var(--font); font-size:1.4rem; font-weight:700; margin:0; text-transform:uppercase; letter-spacing:0.02em; }
  .axis-body{ padding:0 2px 22px; color:var(--muted); max-width:75ch; }
  .year-block summary:hover .year-num{ color:var(--accent); }
  .year-count{ color:var(--muted); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.09em; }
  .lc{ text-transform:lowercase; }

  .pub-category-group{ padding-left:26px; }
  .pub-category-header{
    font-family:var(--font); font-weight:700; font-size:0.76rem; text-transform:uppercase;
    letter-spacing:0.09em; color:var(--accent-2); margin:22px 0 12px;
  }
  .pub-category-group:first-of-type .pub-category-header{ margin-top:16px; }
  .pub-category-group .entry-list{ padding-left:0; }

  .entry-list{ list-style:none; margin:0 0 24px; padding:0 0 6px 26px; display:flex; flex-direction:column; gap:18px; }
  .entry-list .entry-title{ display:block; color:var(--ink); font-weight:500; }
  .entry-list .entry-title a{ text-decoration-color:var(--line); text-underline-offset:3px; }
  .entry-list .entry-title a:hover{ color:var(--accent); text-decoration-color:var(--accent); }
  .entry-list .entry-meta{ display:block; color:var(--muted); font-size:0.9rem; margin-top:3px; }
  .entry-type{
    display:inline-block; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--accent-2); margin-right:2px;
  }
  .entry-list .entry-link{ margin-left:6px; text-decoration:none; color:var(--muted); }
  .entry-list .entry-link:hover{ color:var(--accent); }

  .edu-card{
    position:relative; border:1px solid var(--line); border-radius:18px;
    padding:24px clamp(90px,18vw,130px) 6px 24px; margin-bottom:24px; background:var(--surface);
  }
  .edu-card-logo{ position:absolute; top:20px; right:20px; height:34px; width:auto; max-width:30%; object-fit:contain; }
  .edu-card .entry-list{ margin-bottom:0; padding-left:0; }
  .edu-card .entry-list li + li{ padding-top:18px; border-top:1px dashed var(--line); }

  /* ---- timeline ---- */
  .timeline{
    list-style:none; margin:0; padding:4px 0 0 26px; position:relative;
  }
  .timeline::before{
    content:""; position:absolute; left:5px; top:6px; bottom:14px; width:1px;
    background:var(--line);
  }
  .tl-item{
    position:relative; padding:0 4px 30px 22px; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tl-item:last-child{ padding-bottom:4px; }
  .tl-dot{
    position:absolute; left:-21px; top:6px; width:9px; height:9px; border-radius:50%;
    background:var(--accent); opacity:0.5; transition:opacity .15s, transform .15s;
  }
  .tl-item:hover .tl-dot, .tl-item.tl-open .tl-dot, .tl-item:focus-visible .tl-dot{
    opacity:1; transform:scale(1.35);
  }
  .tl-year{
    display:block; font-family:var(--font); color:var(--accent);
    font-weight:700; font-size:0.88rem; margin-bottom:3px;
  }
  .tl-summary{
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden; font-size:1.02rem; max-width:72ch;
  }
  .tl-detail{
    max-height:0; overflow:hidden; opacity:0; margin-top:0; max-width:72ch;
    transition:max-height .35s ease, opacity .25s ease, margin-top .35s ease;
  }
  .tl-item:hover .tl-detail, .tl-item.tl-open .tl-detail, .tl-item:focus-visible .tl-detail{
    max-height:320px; opacity:1; margin-top:9px;
  }
  .tl-detail p{ margin:0 0 6px; color:var(--muted); font-size:0.92rem; }
  .tl-detail .tl-full-title{ color:var(--ink); }
  .tl-detail .tl-scope{
    display:inline-block; text-transform:uppercase; letter-spacing:0.08em;
    font-size:0.74rem; color:var(--accent-2);
  }
  .tl-detail a{ color:var(--accent-2); text-decoration:none; border-bottom:1px solid currentColor; }
  .tl-detail a:hover{ color:var(--accent); }

  /* reveal-on-scroll */
  .tl-item{
    opacity:0; transform:translateY(18px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .tl-item.tl-inview{ opacity:1; transform:none; }
  .tl-item.tl-hidden{ display:none; }

  /* progress line drawn as the page scrolls (progressive enhancement) */
  @supports (animation-timeline: scroll()){
    @media (prefers-reduced-motion: no-preference){
      .timeline::after{
        content:""; position:absolute; left:5px; top:6px; bottom:14px; width:1px;
        background:var(--accent); transform-origin:top; transform:scaleY(0);
        animation:tl-grow linear forwards;
        animation-timeline:scroll(nearest block);
        animation-range:cover 0% cover 90%;
      }
      @media (min-width:700px){
        .timeline::after{ left:50%; width:2px; margin-left:-1px; }
      }
    }
    @keyframes tl-grow{ to{ transform:scaleY(1); } }
  }

  @media (prefers-reduced-motion: reduce){
    .tl-detail, .tl-dot{ transition:none; }
    .tl-item{ transition:none; opacity:1; transform:none; }
  }

  /* toolbar: filters shared by timeline + publications */
  .tl-toolbar{ margin-top:22px; }
  .filter-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
  .tl-year-select{
    font:inherit; font-size:0.85rem; padding:6px 12px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
  }
  .tl-year-select:hover{ border-color:var(--accent-2); }
  .chip{
    font:inherit; font-size:0.85rem; padding:6px 14px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{ border-color:var(--accent-2); color:var(--ink); }
  .chip.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }

  .filter-count{ font-size:0.82rem; color:var(--muted); margin:0 0 18px; }
  .pub-toolbar{ margin:8px 0 26px; }

  /* zigzag layout once there's room for two columns */
  @media (min-width: 700px){
    .timeline{ padding:4px 0 0; }
    .timeline::before{ left:50%; width:2px; margin-left:-1px; }
    .tl-item{
      width:50%; padding:0 0 46px; box-sizing:border-box;
    }
    .tl-item:nth-child(odd){ margin-right:50%; padding-right:38px; }
    .tl-item:nth-child(even){ margin-left:50%; padding-left:38px; }
    .tl-dot{ left:auto; top:5px; width:11px; height:11px; }
    .tl-item:nth-child(odd) .tl-dot{ right:-6px; }
    .tl-item:nth-child(even) .tl-dot{ left:-6px; }
    .tl-item::after{
      content:""; position:absolute; top:9px; height:2px; width:22px;
      background:var(--line);
    }
    .tl-item:nth-child(odd)::after{ right:0; }
    .tl-item:nth-child(even)::after{ left:0; }
    .tl-summary, .tl-detail{ max-width:none; }
  }

  /* ---- contact page ---- */
  .contact-grid{ display:flex; gap:36px; flex-wrap:wrap; align-items:flex-start; margin-top:4px; }
  .contact-photo-wrap{ flex:0 0 auto; width:180px; display:flex; flex-direction:column; gap:8px; }
  .contact-photo-wrap img{
    width:180px; height:180px; object-fit:cover; border-radius:12px; display:block; background:var(--surface);
  }
  .contact-photo-placeholder{
    width:180px; height:180px; border-radius:12px; background:var(--surface); border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:0.85rem; text-align:center; padding:12px;
  }
  .contact-info{ flex:1 1 280px; min-width:240px; }
  .contact-address{ white-space:pre-line; color:var(--muted); margin:16px 0 0; }

  .icon-links{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  .icon-link{
    display:inline-flex; align-items:center; gap:9px; padding:9px 14px;
    border:1px solid var(--line); border-radius:9px; text-decoration:none;
    color:var(--ink); font-size:0.92rem; transition:border-color .15s, color .15s;
  }
  .icon-link:hover{ border-color:var(--accent); color:var(--accent); }
  .icon-link-glyph{ width:18px; height:18px; flex:0 0 auto; color:var(--accent); }
  .icon-link-glyph svg{ width:100%; height:100%; display:block; }

  /* ---- study areas / carousel ---- */
  .study-area-block{ padding-top:clamp(40px,7vw,64px); padding-bottom:clamp(28px,5vw,44px); }
  .study-area-block h2{ margin-bottom:8px; }
  .study-area-block .page-intro.small{ font-size:0.94rem; margin-bottom:20px; }
  .carousel-wrap{ position:relative; }
  .carousel{
    display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x proximity;
    padding:2px 2px 10px; margin:0 -2px; scrollbar-width:thin;
  }
  .carousel-item{ flex:0 0 auto; width:min(72vw, 300px); scroll-snap-align:start; }
  .carousel-item img{
    width:100%; height:210px; object-fit:cover; border-radius:10px; display:block; background:var(--surface);
  }
  .carousel-item figcaption{ font-size:0.82rem; color:var(--muted); margin-top:7px; }
  .carousel-empty{ color:var(--muted); font-style:italic; }
  .carousel-arrow{
    position:absolute; top:80px; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    cursor:pointer; font-size:1.1rem; line-height:1; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
  }
  .carousel-arrow:hover{ border-color:var(--accent); color:var(--accent); }
  .carousel-arrow.prev{ left:-16px; }
  .carousel-arrow.next{ right:-16px; }
  @media (max-width: 640px){
    .carousel-arrow{ display:none; }
  }

  footer{
    max-width:1600px; margin:0 auto;
    padding: 28px clamp(20px,6vw,64px) 64px;
    color:var(--muted); font-size:0.85rem; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .skip-link{
    position:absolute; left:-9999px; top:0; z-index:100;
    background:var(--accent); color:#fff; padding:12px 20px; border-radius:0 0 8px 0;
    text-decoration:none; font-weight:700; font-family:"Raleway", var(--font);
  }
  .skip-link:focus{ left:0; }
</style>

<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a class="wordmark" href="#top">Jonathan Cazabonne</a>
        <span class="wordmark-role">Mycologist, M.Sc | Ph.D. candidate</span>
      </div>

        <a href="#top">Home</a>
        <a href="#publications">Publications</a>
        <a href="#communications">Outreach</a>
        <!-- Conservation page hidden on purpose — see PAGE_ROUTES below to bring it back online -->
        <!-- <a href="#conservation">Conservation</a> -->
        <a href="#study-areas">Study areas</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer>
    <span id="site-footer-copyright">© 2026 Jonathan Cazabonne. All rights reserved.</span>
  </footer>
</div>

<script id="app-script">
(function(){
  "use strict";

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ---------- routing ----------
  // Conservation page hidden on purpose (kept in the code, just unreachable) —
  // add back  conservation: true,  below to bring it back online.
  var PAGE_ROUTES = { publications: true, communications: true, contact: true, "study-areas": true };
  function currentRoute(){
    var h = (location.hash || "").replace(/^#/, "");
    return PAGE_ROUTES[h] ? h : "home";
  }

  // ---------- shared: year grouping ----------
  function groupByYear(list){
    var map = {}, order = [];
    list.forEach(function(item){
      var y = item.year || "Undated";
      if (!map[y]) { map[y] = []; order.push(y); }
      map[y].push(item);
    });
    var years = order.slice().sort(function(a, b){ return (Number(b) || 0) - (Number(a) || 0); });
    return years.map(function(y){ return { year: y, items: map[y] }; });
  }

  // ---------- view rendering: dispatcher ----------
  function renderView(d){
    if (view === "publications") return renderPublicationsView(d);
    if (view === "communications") return renderCommunicationsView(d);
    if (view === "conservation") return renderConservationView(d);
    if (view === "contact") return renderContactView(d);
    if (view === "study-areas") return renderStudyView(d);
    return renderHomeView(d);
  }
  // ---------- home page ----------
  function renderEducationItem(e){
    var hasLink = e.url && e.url !== "#";
    var degreeHtml = hasLink
      ? '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.degree) + '</a>'
      : esc(e.degree);
    return '<li><span class="entry-title">' + degreeHtml + '</span>' +
      '<span class="entry-meta">' + esc(e.institution) + '</span>' +
      (e.detail ? '<span class="entry-meta">' + esc(e.detail) + '</span>' : '') +
      '<span class="entry-meta">' + esc(e.years) + '</span></li>';
  }

  function renderEduCard(group){
    return '<div class="edu-card">' +
      '<img class="edu-card-logo" src="' + esc(group[0].logo) + '" alt="" loading="lazy" />' +
      '<ul class="entry-list edu-card-list">' + group.map(renderEducationItem).join("") + '</ul>' +
    '</div>';
  }

  function renderEducationView(d){
    if (!d.education || !d.education.length) return "";
    var blocks = [];
    var items = d.education;
    var i = 0;
    while (i < items.length){
      var e = items[i];
      if (e.logo){
        var group = [e];
        var j = i + 1;
        while (j < items.length && items[j].logo === e.logo){
          group.push(items[j]);
          j++;
        }
        blocks.push(renderEduCard(group));
        i = j;
      } else {
        blocks.push('<ul class="entry-list">' + renderEducationItem(e) + '</ul>');
        i++;
      }
    }
    return '<section id="education">' +
      '<h2>Education</h2>' +
      blocks.join("") +
    '</section>';
  }

  function renderExperienceItem(x){
    return '<li><span class="entry-title">' + esc(x.title) + '</span>' +
      '<span class="entry-meta">' + esc(x.institution) + '</span>' +
      '<span class="entry-meta">' + esc(x.period) + '</span></li>';
  }
  function renderExperienceView(d){
    if (!d.experience || !d.experience.length) return "";
    return '<section id="experience"><h2>Professional Experience</h2>' +
      '<ul class="entry-list">' + d.experience.map(renderExperienceItem).join("") + '</ul></section>';
  }

  function renderTrainingItem(x){
    return '<li><span class="entry-title">' + esc(x.title) + (x.hours ? ' (' + esc(x.hours) + ')' : '') + '</span>' +
      '<span class="entry-meta">' + esc(x.provider) + '</span>' +
      '<span class="entry-meta">' + esc(x.year) + '</span></li>';
  }
  function renderTrainingView(d){
    if (!d.training || !d.training.length) return "";
    return '<section id="training"><h2>Scientific Training</h2>' +
      '<ul class="entry-list">' + d.training.map(renderTrainingItem).join("") + '</ul></section>';
  }

  function renderResearchStayItem(x){
    return '<li><span class="entry-title">' + esc(x.institution) + '</span>' +
      '<span class="entry-meta">' + esc(x.location) + '</span>' +
      (x.description ? '<span class="entry-meta">' + esc(x.description) + '</span>' : '') +
      (x.supervisors ? '<span class="entry-meta">' + esc(x.supervisors) + '</span>' : '') +
      '<span class="entry-meta">' + esc(x.period) + '</span></li>';
  }
  function renderResearchStaysView(d){
    if (!d.researchStays || !d.researchStays.length) return "";
    return '<section id="research-stays"><h2>Research Stays</h2>' +
      '<ul class="entry-list">' + d.researchStays.map(renderResearchStayItem).join("") + '</ul></section>';
  }

  function renderAwardItem(x){
    var amt = x.amount != null ? ' (CAD $' + Number(x.amount).toLocaleString("en-CA") + ')' : '';
    return '<li><span class="entry-title">' + esc(x.title) + amt + '</span>' +
      (x.status ? '<span class="entry-meta">' + esc(x.status) + '</span>' : '') +
      '<span class="entry-meta">' + esc(x.year) + '</span></li>';
  }
  function renderAwardsView(d){
    if (!d.awards || !d.awards.length) return "";
    return '<section id="awards"><h2>Awards &amp; Funding</h2>' +
      '<ul class="entry-list">' + d.awards.map(renderAwardItem).join("") + '</ul></section>';
  }

  function renderMembershipItem(x){
    return '<li><span class="entry-title">' + esc(x.organization) + '</span>' +
      '<span class="entry-meta">' + esc(x.role) + '</span>' +
      '<span class="entry-meta">' + esc(x.period) + '</span></li>';
  }
  function renderMembershipsView(d){
    if (!d.memberships || !d.memberships.length) return "";
    return '<section id="memberships"><h2>Society Memberships</h2>' +
      '<ul class="entry-list">' + d.memberships.map(renderMembershipItem).join("") + '</ul></section>';
  }

  function renderCommitteeItem(x){
    return '<li><span class="entry-title">' + esc(x.description) + '</span>' +
      '<span class="entry-meta">' + esc(x.year) + '</span></li>';
  }
  function renderCommitteesView(d){
    if (!d.committees || !d.committees.length) return "";
    return '<section id="committees"><h2>Organizing Committees</h2>' +
      '<ul class="entry-list">' + d.committees.map(renderCommitteeItem).join("") + '</ul></section>';
  }

  function renderEditorialItem(x){
    return '<li><span class="entry-title">' + esc(x.description) + '</span>' +
      (x.period ? '<span class="entry-meta">' + esc(x.period) + '</span>' : '') + '</li>';
  }
  function renderEditorialView(d){
    var hasRoles = d.editorialRoles && d.editorialRoles.length;
    var hasReview = d.peerReview && d.peerReview.length;
    if (!hasRoles && !hasReview) return "";
    var reviewLi = hasReview
      ? '<li><span class="entry-title">Peer review</span><span class="entry-meta">' +
        d.peerReview.map(function(r){ return esc(r.journal) + " (" + r.count + ")"; }).join(", ") + '</span></li>'
      : "";
    return '<section id="editorial"><h2>Editorial Duties</h2><ul class="entry-list">' +
      reviewLi + (hasRoles ? d.editorialRoles.map(renderEditorialItem).join("") : "") + '</ul></section>';
  }

  function renderTeachingItem(x){
    return '<li><span class="entry-title">' + esc(x.title) + (x.hours ? ' (' + esc(x.hours) + ')' : '') + '</span>' +
      '<span class="entry-meta">' + esc(x.institution) + '</span>' +
      '<span class="entry-meta">' + esc(x.year) + '</span></li>';
  }
  function renderTeachingView(d){
    if (!d.teaching || !d.teaching.length) return "";
    return '<section id="teaching"><h2>Teaching</h2>' +
      '<ul class="entry-list">' + d.teaching.map(renderTeachingItem).join("") + '</ul></section>';
  }

  function renderPublicEngagementItem(x){
    return '<li><span class="entry-title">' + esc(x.title) + '</span>' +
      '<span class="entry-meta">' + esc(x.description) + '</span>' +
      '<span class="entry-meta">' + esc(x.year) + '</span></li>';
  }
  function renderPublicEngagementView(d){
    if (!d.publicEngagement || !d.publicEngagement.length) return "";
    return '<section id="public-engagement"><h2>Public Engagement</h2>' +
      '<ul class="entry-list">' + d.publicEngagement.map(renderPublicEngagementItem).join("") + '</ul></section>';
  }

  function renderResearchAxisItem(a){
    return '<details class="axis-block">' +
      '<summary><span class="marker" aria-hidden="true"></span><h3 class="axis-title">' + esc(a.title) + '</h3></summary>' +
      '<p class="axis-body">' + esc(a.description) + '</p>' +
    '</details>';
  }
  function renderResearchAxesView(d){
    if (!d.researchAxes || !d.researchAxes.length) return "";
    return '<section id="research-axes">' +
      '<h2>Research Axes</h2>' +
      '<div class="axis-accordion">' + d.researchAxes.map(renderResearchAxisItem).join("") + '</div>' +
    '</section>';
  }

  function renderAboutPhoto(d){
    if (!d.aboutPhoto) return "";
    return '<figure class="about-photo">' +
      '<img src="' + esc(d.aboutPhoto) + '" alt="' + esc(d.aboutPhotoCaption || d.name) + '" loading="lazy" />' +
      (d.aboutPhotoCaption ? '<figcaption>' + esc(d.aboutPhotoCaption) + '</figcaption>' : "") +
    '</figure>';
  }

  function renderPhotoGallerySection(d){
    if (!d.homeGallery || !d.homeGallery.length) return "";
    var items = d.homeGallery.map(function(p, idx){
      return '<figure class="carousel-item' + (idx === 0 ? " active" : "") + '">' +
        '<img src="' + esc(p.src) + '" alt="' + esc(p.caption || "") + '" loading="lazy" />' +
        (p.caption ? '<figcaption>' + esc(p.caption) + '</figcaption>' : "") +
      '</figure>';
    }).join("");
    return '' +
      '<section id="gallery">' +
        '<div class="carousel-wrap">' +
          '<button class="carousel-arrow prev" type="button" data-target="carousel-home" aria-label="Previous photo">‹</button>' +
          '<div class="carousel slideshow" id="carousel-home">' + items + '</div>' +
          '<button class="carousel-arrow next" type="button" data-target="carousel-home" aria-label="Next photo">›</button>' +
        '</div>' +
      '</section>';
  }

  function renderHomeView(d){
    return '' +
      '<section id="top" class="hero">' +
        '<h1 id="f-name" contenteditable="false">' + esc(d.name) + '</h1>' +
        '<p class="hero-line"><span class="fixed-word">Fungal&nbsp;</span><span class="cycle-word" id="topic-cycle"></span></p>' +
        '<p class="hero-sub" id="f-role" contenteditable="false">' + esc(d.role) + '</p>' +
      '</section>' +
      '<section id="about">' +
        '<h2>About the research</h2>' +
        '<div class="about-layout">' +
          '<p class="bio" id="f-bio" contenteditable="false">' + esc(d.bio) + '</p>' +
          renderAboutPhoto(d) +
        '</div>' +
      '</section>' +
      renderResearchAxesView(d) +
      renderEducationView(d) +
      renderPhotoGallerySection(d) +
      renderExperienceView(d) +
      renderTrainingView(d) +
      renderResearchStaysView(d) +
      renderAwardsView(d) +
      renderMembershipsView(d) +
      renderCommitteesView(d) +
      renderEditorialView(d) +
      renderTeachingView(d) +
      renderPublicEngagementView(d);
  }

  // ---------- publications page ----------
  function renderYearAccordion(groups, itemRenderer){
    return groups.map(function(g){
      return '<details class="year-block">' +
        '<summary><span class="marker" aria-hidden="true"></span><h2 class="year-num">' + esc(g.year) + '</h2>' +
        '<span class="year-count">(<span class="lc">n</span> = ' + g.items.length + ')</span></summary>' +
        '<ul class="entry-list">' + g.items.map(itemRenderer).join("") + '</ul>' +
      '</details>';
    }).join("");
  }

  function boldAuthorHighlight(authors){
    var escaped = esc(authors);
    if (escaped.indexOf("Cazabonne") !== -1) return escaped.replace(/Cazabonne/g, "<strong>Cazabonne</strong>");
    if (escaped.indexOf("et al.") !== -1) return escaped.replace(/et al\./, "<strong>et al.</strong>");
    return escaped;

  // ---------- topic typewriter ----------
  var cycleTimer = null;
  function startCycle(topics){
    var el = document.getElementById("topic-cycle");
    if (!el) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      el.textContent = topics[0] || "";
      return;
    }
    if (!topics.length){ el.textContent = ""; return; }
    var i = 0;
    function typeThenDelete(){
      var word = topics[i % topics.length];
      var ci = 0;
      (function typeStep(){
        el.textContent = word.slice(0, ci);
        ci++;
        if (ci <= word.length){ cycleTimer = setTimeout(typeStep, 55); }
        else { cycleTimer = setTimeout(function(){ deleteStep(word, word.length); }, 1500); }
      })();
    }
    function deleteStep(word, ci){
      if (ci >= 0){
        el.textContent = word.slice(0, ci);
        ci--;
        cycleTimer = setTimeout(function(){ deleteStep(word, ci); }, 32);
      } else {
        i++;
        cycleTimer = setTimeout(typeThenDelete, 250);
      }
    }
    typeThenDelete();
  }
  function stopCycle(){ if (cycleTimer) { clearTimeout(cycleTimer); cycleTimer = null; } }

    return Promise.all(DATA_FILES.map(function(name){
      return fetch("data/" + name + ".json", { cache: "no-cache" }).then(function(res){
        if (!res.ok) throw new Error("Failed to load data/" + name + ".json (" + res.status + ")");
        return res.json();
      });
    })).then(function(parts){
      var d = parts[0];
      DATA_FILES.slice(1).forEach(function(name, i){ d[name] = parts[i + 1].items; });
      return d;

  function wireViewHandlers(){
    Array.prototype.forEach.call(document.querySelectorAll(".carousel-arrow"), function(btn){
      btn.addEventListener("click", function(){
        var track = document.getElementById(btn.dataset.target);
        if (!track) return;
        if (track.classList.contains("slideshow")){
          var items = Array.prototype.slice.call(track.querySelectorAll(".carousel-item"));
          if (!items.length) return;
          var idx = items.findIndex(function(it){ return it.classList.contains("active"); });
          if (idx === -1) idx = 0;
          items[idx].classList.remove("active");
          var dir = btn.classList.contains("prev") ? -1 : 1;
          idx = (idx + dir + items.length) % items.length;
          items[idx].classList.add("active");
          return;
        }
        var amount = Math.min(track.clientWidth * 0.85, 400);
        track.scrollBy({ left: btn.classList.contains("prev") ? -amount : amount, behavior: "smooth" });
      });
    });
    if (view === "conservation") wireTimelineHandlers();
    if (view === "publications") wirePublicationsHandlers();
    if (view === "communications") wireCommunicationsHandlers();
  }

  // ---------- publications: category filter ----------
  function wirePublicationsHandlers(){
    var chips = Array.prototype.slice.call(document.querySelectorAll(".pub-toolbar .chip"));
    if (!chips.length) return;
    var yearBlocks = Array.prototype.slice.call(document.querySelectorAll("#pub-list .year-block"));
    var totalItems = document.querySelectorAll("#pub-list .entry-list li").length;
    var countEl = document.getElementById("pub-count");
    var active = "all";

    function applyFilter(){
      var visibleTotal = 0;
      yearBlocks.forEach(function(block){
        var groups = Array.prototype.slice.call(block.querySelectorAll(".pub-category-group"));
        var visible = 0;
        groups.forEach(function(group){
          var show = active === "all" || group.dataset.category === active;
          group.style.display = show ? "" : "none";
          if (show) visible += group.querySelectorAll("li").length;
        });
        block.style.display = visible ? "" : "none";
        var countSpan = block.querySelector(".year-count");
        if (countSpan) countSpan.innerHTML = "(<span class=\"lc\">n</span> = " + visible + ")";
        visibleTotal += visible;
      });
      if (countEl) countEl.textContent = visibleTotal + " of " + totalItems + " publications shown";
    }

    function withTransition(run){
      if (document.startViewTransition) document.startViewTransition(run);
      else run();
    }

    chips.forEach(function(chip){
      chip.addEventListener("click", function(){
        withTransition(function(){
          active = chip.dataset.category;
          chips.forEach(function(c){
            var isActive = c === chip;
            c.classList.toggle("active", isActive);
            c.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
          applyFilter();
        });
      });
    });

    applyFilter();
  }

    applyFilter();
  }

  // ---------- timeline toolbar: reveal-on-scroll + decade/scope filters ----------
  function wireTimelineHandlers(){
    var items = Array.prototype.slice.call(document.querySelectorAll(".tl-item"));
    if (!items.length) return;

    if ("IntersectionObserver" in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting){
            entry.target.classList.add("tl-inview");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
      items.forEach(function(el){ io.observe(el); });
    } else {
      items.forEach(function(el){ el.classList.add("tl-inview"); });
    }

    var yearSelect = document.getElementById("tl-year-select");
    var chips = Array.prototype.slice.call(document.querySelectorAll(".filter-row .chip"));
    var countEl = document.getElementById("tl-count");
    var activeYear = "all";
    var activeScope = "all";

    function applyFilters(){
      var visible = 0;
      items.forEach(function(el){
        var matchYear = activeYear === "all" || el.dataset.year === activeYear;
        var matchScope = activeScope === "all" || el.dataset.scopeGroup === activeScope;
        var show = matchYear && matchScope;
        el.classList.toggle("tl-hidden", !show);
        if (show) visible++;
      });
      if (countEl) countEl.textContent = visible + " of " + items.length + " milestones shown";
    }

    function withTransition(run){
      if (document.startViewTransition) document.startViewTransition(run);
      else run();
    }

    if (yearSelect){
      yearSelect.addEventListener("change", function(){
        withTransition(function(){
          activeYear = yearSelect.value;
          applyFilters();
        });
      });
    }

    chips.forEach(function(chip){
      chip.addEventListener("click", function(){
        withTransition(function(){
          activeScope = chip.dataset.scopeGroup;
          chips.forEach(function(c){
            var isActive = c === chip;
            c.classList.toggle("active", isActive);
            c.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
          applyFilters();
        });
      });
    });

    applyFilters();
  }

  function updateNavCurrent(){
    var navHref = view === "home" ? "#top" : "#" + view;
    Array.prototype.forEach.call(document.querySelectorAll(".topnav a"), function(a){
      if (a.getAttribute("href") === navHref) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function applyRoute(fromHashChange){
    view = currentRoute();
    paint();
    updateNavCurrent();
    var anchor = (location.hash || "").replace(/^#/, "");
    if (view === "home" && anchor && !PAGE_ROUTES[anchor]){
      requestAnimationFrame(function(){
        var el = document.getElementById(anchor);
        if (el) el.scrollIntoView({ behavior: fromHashChange ? "smooth" : "auto", block: "start" });
      });
    } else {
      window.scrollTo(0, 0);
    }
  }

  // ---------- timeline tap-to-open (desktop keeps hover; touch/keyboard get a toggle) ----------
  app.addEventListener("click", function(ev){
    if (ev.target.closest("a")) return;
    var item = ev.target.closest(".tl-item");
    if (item) item.classList.toggle("tl-open");
  });
  app.addEventListener("keydown", function(ev){
    if (ev.key !== "Enter" && ev.key !== " ") return;
    var item = ev.target.closest && ev.target.closest(".tl-item");
    if (item){ ev.preventDefault(); item.classList.toggle("tl-open"); }
  });

  // ---------- init ----------
  loadSiteData().then(function(d){
    current = d;
    if (current.timeline) current.timeline.sort(function(a, b){ return (b.year || 0) - (a.year || 0); });
    try {
      var savedHash = sessionStorage.getItem("__site_hash__");
      if (savedHash && !location.hash){ history.replaceState(null, "", savedHash); }
      sessionStorage.removeItem("__site_hash__");
    } catch (e) {}
    view = currentRoute();
    applyRoute(false);
    window.addEventListener("hashchange", function(){ applyRoute(true); });
  }).catch(function(err){
    app.innerHTML = '<p style="padding:6rem 1.5rem;text-align:center;">Couldn’t load site content. Please refresh the page.</p>';
    console.error(err);
  });

})();
</script>
</body>
</html>
